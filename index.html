function spendTime(n=0.5){S.hours=Math.max(0,Math.round(((S.hours??8)-n)*2)/2)}
function hoursText(h){
  h=h??S.hours??0;
  const whole=Math.floor(h);
  return h%1?`${whole}小時30分`:`${whole}小時`;
}
function noTime(){return (S.hours??8)<=0}
function timeOutPassage(){
  if(S.flags.phase==="night") return {title:"夜已深",text:["晚上的 4 小時用完了。你必須回家，結束今天。"],links:[{label:"回家，結束今天",go:"go_home"}]};
  return {title:"時間到了",text:["白天的 8 小時用完了。你必須回家。"],links:[{label:"回家",go:"go_home"}]};
}
function endureCost(base){
  if(S.corruption>=50) return 0;
  return Math.max(0,Math.round(base*(1-S.corruption/50)));
}
function getActor(locId){return rnd(LOC_ACTORS[locId]||LOC_ACTORS.train)}
function ensureNpcs(){
  if(!S.npc) S.npc={};
  NAMED_NPCS.forEach(n=>{ if(!S.npc[n.id]) S.npc[n.id]={aff:randInt(0,10), impExp:0}; });
}
function npcById(id){return NAMED_NPCS.find(n=>n.id===id)}
function calcImpulse(id){
  ensureNpcs();
  const st=S.npc[id]||{aff:0,impExp:0};
  return clamp(Math.round(toyCount()*10 + st.aff/5 + S.fame/10 + st.impExp/10));
}
function npcStatLine(id){
  const st=S.npc[id];
  return `好感 ${st.aff}　衝動 ${calcImpulse(id)}　衝動經驗 ${st.impExp}`;
}
function pickNamedNpc(locId){
  if(!S.flags.greetedToday) S.flags.greetedToday=[];
  ensureNpcs();
  const native=NAMED_NPCS.filter(n=>n.loc===locId&&!S.flags.greetedToday.includes(n.id));
  const others=NAMED_NPCS.filter(n=>n.loc!==locId&&!S.flags.greetedToday.includes(n.id));
  if(native.length&&(chance(0.82)||!others.length)) return rnd(native);
  if(others.length&&chance(0.18)) return rnd(others);
  if(native.length) return rnd(native);
  return null;
}
function tryNpcGreeting(locId,locName){
  if(!locId||locId==="train") return null;
  if(!chance(0.75)) return null;
  const npc=pickNamedNpc(locId);
  if(!npc) return null;
  S.flags.greetedToday.push(npc.id);
  S.flags.currentNpc=npc.id;
  spendTime(0.5);
  const offsite=npc.loc!==locId;
  const greet=rnd([
    `${npc.name}（${npc.role}）看見你，點了點頭：「${S.heroine}，你好。」`,
    `你在${locName}碰到${npc.name}。對方停下來跟你打招呼。`,
    `${npc.name}看見你，走過來：「今天也在這裡啊。」`
  ]);
  const note=offsite?`（偶遇：平常多在${(CAMPUS_LOCS.find(l=>l.id===npc.loc)||OUT_LOCS.find(l=>l.id===npc.loc)||{}).label||npc.loc}。）`:"";
  const cloth=npcClothesReaction(npc);
  return {title:`偶遇・${npc.name}`,text:[greet,note,cloth,npcStatLine(npc.id)].filter(Boolean),links:[{label:"與他交流",go:"npc_chat"},{label:"離開",go:"stay_loc"}]};
}
function npcRoleFamily(npc){
  if(npc.role.includes("導師")||npc.role.includes("老師")) return "teacher";
  if(npc.role.includes("校工")) return "janitor";
  if(npc.role.includes("學長")) return "senpai";
  if(npc.role.includes("帥哥")) return "handsome";
  if(npc.role.includes("宅男")) return "otaku";
  if(npc.role.includes("不良")) return "delinquent";
  if(npc.role.includes("便利")) return "clerk";
  if(npc.role.includes("清潔")) return "cleaner";
  if(npc.role.includes("公寓")) return "apt";
  if(npc.role.includes("停車場")) return "park";
  return "other";
}

function afterNpcChat(){
  const id=S.flags.currentNpc;
  const npc=npcById(id);
  if(!npc) return {title:"結束",text:["人已經走了。"],links:[{label:"接下來",go:"stay_loc"}]};
  const st=S.npc[id];
  st.aff=clamp(st.aff+randInt(3,6));
  const imp=calcImpulse(id);
  const lines=[`你跟${npc.name}聊了一會兒。`,npcStatLine(id)];
  if(st.aff<20 && imp>50){
    if(chance(imp/3/100)) return {title:`襲擊・被操・${npc.name}`,text:[...lines,npcAttackText(npc,"sex")],onEnter:()=>{st.aff=clamp(st.aff-10);st.impExp=clamp(st.impExp+12);fx({corruption:6,arousal:8,pussy:1,people:1,know:2,semen:16})},links:[{label:"接下來",go:"stay_loc"}]};
    if(chance(imp/2/100)) return {title:`襲擊・騷擾・${npc.name}`,text:[...lines,npcAttackText(npc,"harass")],onEnter:()=>{st.aff=clamp(st.aff-6);st.impExp=clamp(st.impExp+8);fx({corruption:3,arousal:5,harass:1,know:1})},links:[{label:"接下來",go:"stay_loc"}]};
  }
  if(st.aff>20){
    const links=[];
    if(S.flags.datedToday) links.push({label:"同意約會（今天已跟男朋友約會，無法同意）",go:"#",disabled:true});
    else links.push({label:"同意約會",go:"npc_date"});
    links.push({label:"拒絕",go:"npc_refuse"});
    return {title:`${npc.name}的邀約`,text:[...lines,`${npc.name}看著你：「要不要跟我出去一下？」`],links};
  }
  return {title:"交流結束",text:lines,links:[{label:"接下來",go:"stay_loc"}]};
}
function npcRefuse(){
  const id=S.flags.currentNpc;
  const npc=npcById(id);
  if(!npc) return {title:"結束",text:[],links:[{label:"接下來",go:"stay_loc"}]};
  const st=S.npc[id];
  const imp=calcImpulse(id);
  if(st.aff>50 && chance(imp/1.5/100)){
    return startNpcDate(true);
  }
  return {title:"你拒絕了",text:[`你拒絕了${npc.name}。對方點了點頭，沒有再多說。`],links:[{label:"接下來",go:"stay_loc"}]};
}

function getNakedLevel(){

function stayAtLocation(){
  const locId=S.flags.currentLoc;
  const locName=S.flags.currentLocName||"此地";
  if(!locId) return {title:"接下來",text:["要繼續活動嗎？"],links:[{label:"回主選單",go:"hub"}]};
  if(noTime()) return timeOutPassage();
  const links=[
    {label:"進行日常活動",go:"daily_act",loc:locId},
    {label:"什麼都不做，休息",go:"daily_rest"}
  ];
  if(!S.clothes.top) links.push({label:"穿回上衣",go:"put_on",part:"top"});
  if(!S.clothes.bottom) links.push({label:"穿回下衣",go:"put_on",part:"bottom"});
  if(!S.clothes.bra) links.push({label:"穿回內衣",go:"put_on",part:"bra"});
  if(!S.clothes.panty) links.push({label:"穿回內褲",go:"put_on",part:"panty"});
  const canExpo=(S.exposure>=70)||(S.exposure>=50&&S.flags.lastArea==="outside")||(S.exposure>=20&&S.flags.phase==="night");
  if(canExpo) links.push({label:"野外露出",go:"expo_start",loc:locId});
  if(locId==="classroom"||locId==="art") links.push({label:"上課",go:"class_start",loc:locId});
  if(locId==="convenience") links.push({label:"打工",go:"work_start",loc:locId});
  links.push({label:"離開此地，前往其他地方",go:"after_loc"});
  links.push({label:"直接回家",go:"go_home"});
  const status=[];
  if(!S.clothes.top) status.push("上衣已脫");
  if(!S.clothes.bottom) status.push("下衣已脫");
  if(!S.clothes.bra) status.push("內衣已脫（上空）");

  const statusText=status.length?`目前衣著：${status.join("、")}`:"";

  return {title:`仍在${locName}`,text:[`你還在${locName}。要在這裡做什麼？`,statusText,atmosphere].filter(Boolean),links};
}

    return {title:`跟${b}上床・${tag}`,text,onEnter:()=>fx({affection:tag==="NTR"?-6:6,arousal:-10,energy:4},[{stat:"好感度",text:tag==="NTR"?"這次上床沒有拉近距離，好感略降。":"一起過夜讓好感上升。"}]),links:[{label:"睡覺，進入下一天",go:"__sleep"}]};
  },
  night_out:()=>({title:"夜遊開始",text:[`夜遊體力：${S.flags.nightEnergy}`],links:[{label:"選擇夜遊地點",go:"outside_select"}]}),
  night_stay:()=>({title:"待在家",text:[`你選擇留在家裡。`],onEnter:()=>fx({energy:8,arousal:-7}),links:[{label:"睡覺，進入下一天",go:"__sleep"}]}),
  orgy_start:()=>orgyStart(),orgy_continue:()=>orgyContinue(),orgy_end:()=>orgyEnd(),
  ending:()=>{
    const k=S.know,y=S.yield,c=S.corruption,f=S.fame;
    let main=k>=80?`${S.bfName}已完全知情並在某種程度上參與。`:k>60?`${S.bfName}清楚知道事實。`:k>30?`${S.bfName}已有明顯懷疑。`:`${S.bfName}大多仍不知情。`;
    return {title:"週末結算",text:[main,`知名度 ${f}　知情度 ${k}　屈服度 ${y}　沉淪度 ${c}　露出經驗 ${S.exposure}`,`累計：口${S.mouth} 穴${S.pussy} 後穴${S.ass} 經驗${S.people} 騷擾${S.harass}`],links:[{label:"再過一週",go:"soft_reset"}]};
  }
};

const $=id=>document.getElementById(id);
function go(name,extra={}){
  if(extra.dest) S.flags.dest=extra.dest;
  if(extra.loc) S.flags.loc=extra.loc;
  if(extra.part) S.flags.stripPart=extra.part;
  if(extra.act) S.flags.expoAct=extra.act;
  if(name==="reset"||name==="soft_reset"){
    const keep=name==="soft_reset";
    const h=S.heroine,b=S.bfName,k=S.know,y=S.yield,f=S.fame,exp=S.exposure,aff=S.affection||50,npc=S.npc;
    S=fresh();
    if(keep){S.heroine=h;S.bfName=b;S.know=k;S.yield=y;S.fame=f;S.exposure=exp;S.affection=aff;S.npc=npc}
    name="morning";
  }
  if(name==="__sleep"){
    S.day++;S.slot=0;S.flags.phase="day";S.flags.nightEnergy=0;S.flags.orgyDay=false;S.flags.orgyCount=0;S.flags.datedToday=false;S.flags.greetedToday=[];S.flags.evt=null;S.flags.afterClimax=null;S.flags.witnessPending=null;
    name=S.day>4?"ending":"morning";
  }
  if(name!=="climax"&&name!=="after_climax"&&name!=="witness_view"&&S.arousal>=50&&!S.flags.evt){
    S.flags.afterClimax=name; name="climax";
  }
  S.passage=name; lastDelta=[]; S.lastExplain=[]; S.aftermath="";
  render(true);
}

function render(enter){
  if(S.passage==="setup"){
    $("passage").innerHTML=`
      <div class="pname">:: setup</div>
      <h2>遊戲開始前設置</h2>
      <p>請輸入女主角與男朋友名稱，以及各項初始數值。</p>
      <label>女主角名稱</label>
      <input type="text" id="input-heroine" value="${S.heroine}">
      <label>男朋友名稱</label>
      <input type="text" id="input-bf" value="${S.bfName}">
      <label>初始知名度 (0-100)</label>
      <input type="number" id="input-fame" min="0" max="100" value="${S.fame}">
      <label>初始知情度 (0-100)</label>
      <input type="number" id="input-know" min="0" max="100" value="${S.know}">
      <label>初始屈服度 (0-200)</label>
      <input type="number" id="input-yield" min="0" max="200" value="${S.yield}">
      <label>初始露出經驗 (0-100)</label>
      <input type="number" id="input-exposure" min="0" max="100" value="${S.exposure}">
      <label>初始沉淪度 (0-100)</label>
      <input type="number" id="input-corruption" min="0" max="100" value="${S.corruption}">
      <div class="links" style="margin-top:10px">
        <button type="button" id="btn-start">→ 確認並開始</button>
      </div>`;
    $("btn-start").onclick=()=>{
      S.heroine=($("input-heroine").value.trim()||"千紗");
      S.bfName=($("input-bf").value.trim()||"山本");
      S.fame=clamp(parseInt($("input-fame").value)||5);
      S.know=clamp(parseInt($("input-know").value)||20);
      S.yield=clamp200(parseInt($("input-yield").value)||0);
      S.exposure=clamp(parseInt($("input-exposure").value)||0);
      S.corruption=clamp(parseInt($("input-corruption").value)||0);
      $("game-title").textContent="學生模擬器";
      go("morning");
    };
    renderSide(); return;
  }
  if(S.passage==="morning"){
    const def=P.morning();
    const el=$("passage");
    el.innerHTML=`<div class="pname">:: morning</div><h2>${def.title}</h2>`;
    def.text.forEach(t=>{const p=document.createElement("p");p.textContent=t;el.appendChild(p)});
    const grid=document.createElement("div"); grid.className="check-grid";
    [["vibe","跳蛋"],["plug","肛塞"],["dildo","假陽具"],["chain","胸鍊"],["noBra","不穿內衣"],["noPanty","不穿內褲"]].forEach(([k,label])=>{
      grid.innerHTML+=`<label><input type="checkbox" id="toy_${k}"> ${label}</label>`;
    });
    el.appendChild(grid);
    const box=document.createElement("div"); box.className="links";
    const btn=document.createElement("button"); btn.type="button"; btn.textContent="確認配件並出門";
    btn.onclick=()=>{
      S.toys.vibe=$("toy_vibe").checked; S.toys.plug=$("toy_plug").checked;
      S.toys.dildo=$("toy_dildo").checked; S.toys.chain=$("toy_chain").checked;
      S.toys.noBra=$("toy_noBra").checked; S.toys.noPanty=$("toy_noPanty").checked;
      // 早晨配件直接反映到即時衣著狀態
      S.clothes.bra=!S.toys.noBra;
      S.clothes.panty=!S.toys.noPanty;
      S.clothes.top=true;
      S.clothes.bottom=true;
      if(toyCount()) fx({arousal:toyCount()*2});
      go("hub");
    };
    box.appendChild(btn); el.appendChild(box);
    renderSide(); return;
  }

  if(S.passage==="expo_strip"&&S.flags.stripPart){
    const def=expoStrip(S.flags.stripPart);
    if(enter&&def.onEnter) def.onEnter();
    renderPassage(def); return;
  }
  if(S.passage==="expo_do"&&S.flags.expoAct){
    const def=expoDo(S.flags.expoAct);
    if(enter&&def.onEnter) def.onEnter();
    renderPassage(def); return;
  }

  let def=P[S.passage]?P[S.passage]():{title:"?",text:["錯誤"],links:[{label:"回主選單",go:"hub"}]};
  if(enter&&def.onEnter) def.onEnter();
  updateOS();
  renderPassage(def);
}

function renderPassage(def){
  const el=$("passage"); el.innerHTML="";
  el.appendChild(Object.assign(document.createElement("div"),{className:"pname",textContent:`:: ${S.passage}`}));
  el.appendChild(Object.assign(document.createElement("h2"),{textContent:def.title}));
  (def.text||[]).forEach(t=>{const p=document.createElement("p");p.textContent=t;el.appendChild(p)});
  if(lastDelta.length){
    const p=document.createElement("p");
    lastDelta.forEach(([k,d])=>{const s=document.createElement("span");s.className="delta"+(d<0?" neg":"");s.textContent=`${LABEL[k]||k} ${d>0?"+":""}${d}`;p.appendChild(s)});
    el.appendChild(p);
  }
  if(S.lastExplain?.length){
    const box=document.createElement("div"); box.className="explain";
    box.innerHTML=S.lastExplain.map(e=>`<div><b>${e.stat}：</b>${e.text}</div>`).join("");
    el.appendChild(box);
  }
  if(S.aftermath){const af=document.createElement("div");af.className="aftermath";af.textContent=S.aftermath;el.appendChild(af)}

  const box=document.createElement("div"); box.className="links";
  (def.links||[]).forEach(l=>{
    const b=document.createElement("button"); b.type="button";
    b.append(document.createTextNode(l.label));
    if(l.hint){const sm=document.createElement("small");sm.textContent=l.hint;b.appendChild(sm)}
    if(l.disabled) b.disabled=true;
    b.onclick=()=>{
      if(l.dest) S.flags.dest=l.dest;
      if(l.loc) S.flags.loc=l.loc;
      if(l.part) S.flags.stripPart=l.part;
      if(l.act) S.flags.expoAct=l.act;
      go(l.go,{dest:l.dest,loc:l.loc,part:l.part,act:l.act});
    };
    box.appendChild(b);
  });
  el.appendChild(box);
  renderSide();
}

function renderSide(){
  $("clock").innerHTML=S.day>4?"<b>週末</b>":`<b>${weekdayName()}</b>・第 <b>${S.day+1}</b> 天・剩餘 <b>${hoursText()}</b>`;
  const stats=$("stats"); stats.innerHTML="<h3>狀態</h3>";
  const displayEnergy=S.flags.phase==="night"?S.flags.nightEnergy:S.energy;
  [["energy","體力"],["corruption","沉淪度"],["arousal","興奮度"],["fame","知名度"],["know","知情度"],["yield","屈服度"],["affection","好感度"],["exposure","露出經驗"]].forEach(([k,n])=>{
    const val=k==="energy"?displayEnergy:S[k];
    const max=k==="yield"?200:100;
    const d=document.createElement("div"); d.className="stat";
    d.innerHTML=`<span>${n}</span><span></span><span class="v">${val}</span><div class="bar${val<max*0.25?" low":""}"><i style="width:${Math.min(100,val/max*100)}%"></i></div>`;
    stats.appendChild(d);
  });
  const d2=document.createElement("div"); d2.className="stat";
  d2.innerHTML=`<span>口</span><span></span><span class="v">${S.mouth}</span><span>穴</span><span></span><span class="v">${S.pussy}</span><span>後穴</span><span></span><span class="v">${S.ass}</span><span>經驗</span><span></span><span class="v">${S.people}</span><span>騷擾</span><span></span><span class="v">${S.harass}</span>`;
  stats.appendChild(d2);
  const now=$("now-text");
  if(now) now.innerHTML=nowStatusHtml();
  const osCard=$("os-card");
  if(S.know>=20&&S.os){osCard.style.display="block";$("os-text").textContent=S.os}else osCard.style.display="none";
  $("vars").innerHTML=`${S.heroine} ／ ${S.bfName}
$fame=${S.fame} $know=${S.know} $yield=${S.yield} $aff=${S.affection||0}
體力=${displayEnergy} $corruption=${S.corruption} 露出=${S.exposure}
配件=${toyCount()}  phase=${S.flags.phase} lastArea=${S.flags.lastArea}
使用 ${S.mouth}/${S.pussy}/${S.ass} 經驗${S.people} 騷擾${S.harass}
<span class="c">${S.passage}</span>`;
}

const KEY="chisa-week-v21";
function toast(m){$("toast").textContent=m;setTimeout(()=>$("toast").textContent="",2000)}
$("btn-save").onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));toast("已存檔")}catch(e){toast("無法存檔")}};
$("btn-load").onclick=()=>{try{const r=localStorage.getItem(KEY);if(!r){toast("無存檔");return}S=Object.assign(fresh(),JSON.parse(r));$("game-title").textContent="學生模擬器";render(false);toast("已讀取")}catch(e){toast("讀檔失敗")}};
let armed=false;
$("btn-reset").onclick=e=>{
  if(!armed){armed=true;e.target.textContent="再按確認";setTimeout(()=>{armed=false;e.target.textContent="重新開始"},2400);return}
  armed=false;e.target.textContent="重新開始";go("reset");
};
render(true);
</script>
</body>
</html>
